  core:picodrive:src:
    desc: Fetch the pinned PicoDrive (libretro/picodrive) source tarball and its emu2413, dr_libs and libpicofe submodule tarballs into vendor/ and verify each sha256, they ship as corresponding source
    status:
      - test -f vendor/picodrive-src.tar.gz
      - test -f vendor/picodrive-emu2413-src.tar.gz
      - test -f vendor/picodrive-dr_libs-src.tar.gz
      - test -f vendor/picodrive-libpicofe-src.tar.gz
      - test "$(cat vendor/picodrive-src.sha 2>/dev/null)" = "$(sh cores/picodrive/build.sh stamp {{.PICODRIVE_COMMIT}} host | grep -e '^commit=' -e '^module_.*_sha256=')"
