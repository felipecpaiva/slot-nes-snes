      - sh cores/mednafen_ngp/build.sh fetch {{.MEDNAFEN_NGP_COMMIT}} vendor/mednafen_ngp-src.tar.gz
      - echo "{{.MEDNAFEN_NGP_COMMIT}}" > vendor/mednafen_ngp-src.sha

