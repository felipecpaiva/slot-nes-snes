      - task: upstream:build
      - task: build
      - task: core:host
      - test -f vendor/mgba_libretro.dylib
      - test -f vendor/gpsp_libretro.dylib
      - test -f vendor/fceumm_libretro.dylib
      - test -f vendor/snes9x_libretro.dylib
      - test -f vendor/nestopia_libretro.dylib
      - test -f vendor/snes9x2005_plus_libretro.dylib
      - test -f vendor/genesis_plus_gx_libretro.dylib
      - test -f vendor/pcsx_rearmed_libretro.dylib
      - test -f vendor/mednafen_pce_fast_libretro.dylib
      - test -f vendor/mednafen_wswan_libretro.dylib
      - test -f vendor/mednafen_lynx_libretro.dylib
      - test -f vendor/mednafen_ngp_libretro.dylib
      - test -f vendor/picodrive_libretro.dylib
      - test -f vendor/stella2014_libretro.dylib
      - test -f vendor/prosystem_libretro.dylib
      - test -f vendor/mednafen_vb_libretro.dylib
      - task: test
      - |
        {{.TASK_EXE}} -d build/slot test:card || {
          echo "test:card failed, retrying once (upstream card tests are timing sensitive)" >&2
          {{.TASK_EXE}} -d build/slot test:card
        }
      - sh build/slot/card/test-expansion.sh
      - task: fmt:check
      - task: lint
      - sh scripts/check-upstream-tests.sh
      - task: diffsurface:check
      - task: harness:control
      - task: harness:compare
      - task: harness:inject

  diffsurface:
    desc: Print the net changed lines per upstream file the patches touch and rewrite docs/UPSTREAM-TOUCHPOINTS.md (one row per changed hunk, reasons kept); new hunks need a reason
    cmds:
      - sh scripts/diffsurface.sh

  diffsurface:check:
    desc: Fail if docs/UPSTREAM-TOUCHPOINTS.md does not match patches/ or a touch point has no reason
    cmds:
      - python3 scripts/test_touchpoints.py -q
      - sh scripts/diffsurface.sh --check

  fmt:check:
    desc: Run rustfmt --check on every .rs file we add or change in build/slot
    cmds:
      - sh scripts/check-format.sh

  lint:
    desc: Run both clippy passes in both trees and fail on any warning upstream does not have
    cmds:
      - sh scripts/check-lint.sh

  harness:warm:
    desc: Copy frame_dump into both trees, build it, and pre-build the label cache into build/harness/root from harness/root-template
    deps: [upstream:build, build]
    cmds:
      - sh scripts/harness.sh warm

  harness:control:
    desc: Run every harness leg twice in each tree and fail on any differing frame hash or on patched retries above upstream's plus one, then record that the control passed. Needs a mostly idle machine, a busy one fails closed
    deps: [upstream:build, build]
    cmds:
      - sh scripts/harness.sh control

  harness:compare:
    desc: Run every harness leg twice in upstream and twice in patched and fail unless all four runs are identical, refuses until harness:control passed for the current inputs. Needs a mostly idle machine, a busy one fails closed
    deps: [upstream:build, build]
    cmds:
      - sh scripts/harness.sh compare

  harness:inject:
    desc: Prove the harness can fail, two composite --no-wait runs on a cold cache of 403 large generated labels must differ in at least 20 frames, the same runs on a warm cache must show 0, and two composite --wait runs on the same cold script must show 0
    deps: [upstream:build, build]
    cmds:
      - sh scripts/harness.sh inject

  bench:compare:
    desc: Run core_bench for mgba and gpsp on harness/roms in both trees and fail if the patched minimum of the repeat medians is over 2% above upstream's
    deps: [upstream:build, build]
    cmds:
      - sh scripts/bench-compare.sh

  bench:device:
    desc: Run core_bench on a connected device over adb. CORE=mgba|gpsp|fceumm|nestopia|snes9x|snes9x2005_plus|genesis_plus_gx|pcsx_rearmed (default mgba), ROM=local path (default harness/roms/240pee_mb.gba) or ROM_ON_DEVICE=/mnt/sdcard/Games/... for a cart already on the card (nothing is pushed), ARGS and SD optional. Run task deploy:device first, the core under test is the one already in System/
    deps: [build]
    env:
      CORE: '{{.CORE}}'
      ROM: '{{.ROM}}'
      ROM_ON_DEVICE: '{{.ROM_ON_DEVICE}}'
      SD: '{{.SD}}'
      ARGS: '{{.ARGS}}'
    cmds:
      - sh scripts/bench-device.sh

  perf:eval:
    desc: Run core_bench on the device for every platform and core pair (3 runs each, normal, serialize, fast-forward), record governor and SoC temperature, discard hot runs, write docs/perf/<date>/ logs and perf-eval.md. Needs the cores deployed (task deploy:device) and a rested device on the charger. DATE, RUNS, SD optional
    deps: [build]
    env:
      DATE: '{{.DATE}}'
      RUNS: '{{.RUNS}}'
      SD: '{{.SD}}'
    cmds:
      - sh scripts/perf-eval.sh

  perf:play:
    desc: Automated device play for #45. Backs up the device config, points slot at a card cart per pair, injects the same scripted input for MINUTES (default 10) over RUNS runs (default 3), ejects, pulls slot.log with ROM names redacted into docs/perf/<date>/play/ and writes play-eval.md. No args runs the default pairs, CORE or PLATFORM narrow them, CORE and PLATFORM and STEM run one custom pair. Restores the device on exit. SD, DATE optional
    env:
      CORE: '{{.CORE}}'
      PLATFORM: '{{.PLATFORM}}'
      STEM: '{{.STEM}}'
      MINUTES: '{{.MINUTES}}'
      RUNS: '{{.RUNS}}'
      SD: '{{.SD}}'
      DATE: '{{.DATE}}'
    cmds:
      - sh scripts/auto-play.sh

  readout:device:
    desc: Pull slot.log off the device and print the audio starve lines and the latency summary. Pass a saved log with CLI_ARGS to re-read it
    cmds:
      - sh scripts/device-readout.sh {{.CLI_ARGS}}

  eval:frontend-cost:
    desc: Time convert, publish and upload per frame for mgba, gpsp, fceumm and snes9x at their real canvases and fail if NES or SNES is over 5% above the larger GBA figure
    deps: [build]
    cmds:
      - sh evals/eval-frontend-cost.sh

  dist:device:
    desc: Build build/dist/<release name>/ for the H700, slot's own dist:device plus the fceumm, snes9x, nestopia, snes9x2005_plus, Genesis Plus GX, pcsx_rearmed, Beetle PCE Fast, Beetle Cygne, Beetle Lynx and Beetle NeoPop cores, their .meta, source and licences. Fails unless every core's shippable set exists. Skipped while its inputs are unchanged
    deps: [build, core:device]
    vars:
      NAME:
        sh: . ./SLOT_PIN && echo "slot-nes-snes-$tag-$(cat VERSION)"
    sources:
      - SLOT_PIN
      - VERSION
      - mise.toml
      - patches/*.patch
      - licenses/*
      - cores/**/*
      - vendor/fceumm_libretro.so*
      - vendor/fceumm-src.*
      - vendor/snes9x_libretro.so*
      - vendor/snes9x-src.*
      - vendor/nestopia_libretro.so*
      - vendor/nestopia-src.*
      - vendor/snes9x2005_plus_libretro.so*
      - vendor/snes9x2005_plus-src.*
      - vendor/genesis_plus_gx_libretro.so*
      - vendor/genesis_plus_gx-src.*
      - vendor/pcsx_rearmed_libretro.so*
      - vendor/pcsx_rearmed-src.*
      - vendor/mednafen_pce_fast_libretro.so*
      - vendor/mednafen_pce_fast-src.*
      - vendor/mednafen_wswan_libretro.so*
      - vendor/mednafen_wswan-src.*
      - vendor/mednafen_lynx_libretro.so*
      - vendor/mednafen_lynx-src.*
      - vendor/mednafen_ngp_libretro.so*
      - vendor/mednafen_ngp-src.*
      - scripts/dist-device.sh
      - scripts/device-sh.sh
      - scripts/fetch-task.sh
      - scripts/lib.sh
      - scripts/zip-check.sh
      - taskfile.yml
    generates:
      - build/dist/{{.NAME}}/System/slot
    cmds:
      - sh scripts/dist-device.sh

  src-tarball:
    desc: Write build/slot-nes-snes-src-<tag>-<ns.N>.tar.gz (work/slot HEAD plus this repo HEAD, the GPL-3 source) and copy it into the dist tree. Fails unless patches/ rebuild work/slot HEAD
    cmds:
      - task: patches:check
      - sh scripts/src-tarball.sh

  zip:
    desc: Write build/slot-nes-snes-<tag>-<ns.N>-h700.zip from a fresh dist tree, source tarball included
    cmds:
      - task: dist:device
      - task: src-tarball
      - |
        set -eu
        . ./SLOT_PIN
        name="slot-nes-snes-$tag-$(cat VERSION)"
        rm -f "build/$name-h700.zip"
        (cd build/dist && zip -qry "../$name-h700.zip" "$name")
        echo "built build/$name-h700.zip"

  deploy:device:
    desc: Build the dist tree and push its System/ onto a device over adb (not the 18 MB source tarball), then restart it. SD defaults to /mnt/sdcard
    vars:
      SD: '{{.SD | default "/mnt/sdcard"}}'
    cmds:
      - task: dist:device
      - adb wait-for-device
      - |
        set -eu
        . ./SLOT_PIN
        sys="build/dist/slot-nes-snes-$tag-$(cat VERSION)/System"
        adb shell mkdir -p '{{.SD}}/System/licenses'
        for f in "$sys"/*; do
          [ "$f" = "$sys/licenses" ] || adb push "$f" '{{.SD}}/System/'
        done
        for f in "$sys"/licenses/*; do
          case "$f" in */slot-nes-snes-src-*) ;; *) adb push "$f" '{{.SD}}/System/licenses/' ;; esac
        done
      - adb shell 'chmod +x {{.SD}}/System/slot {{.SD}}/System/fceumm_libretro.so {{.SD}}/System/snes9x_libretro.so {{.SD}}/System/nestopia_libretro.so {{.SD}}/System/snes9x2005_plus_libretro.so {{.SD}}/System/genesis_plus_gx_libretro.so {{.SD}}/System/pcsx_rearmed_libretro.so {{.SD}}/System/mednafen_ngp_libretro.so && sync'
      - adb reboot
      - adb wait-for-device
      - 'echo "deployed to {{.SD}}, device rebooting"'

  log:device:
    desc: Read slot's log back off a connected device
    vars:
      SD: '{{.SD | default "/mnt/sdcard"}}'
    cmds:
      - adb shell 'cat {{.SD}}/Logs/slot.log'

  roms:push:
    desc: 'Push a ROM library (zips ok, duplicates skipped), saves and optionally states to the device over adb. Pass flags with CLI_ARGS, e.g. task roms:push -- --src ~/ROMS --only gba'
    cmds:
      - python3 scripts/push-roms.py {{.CLI_ARGS}}

  labels:fetch:
    desc: 'Fetch real cart labels onto the SD card (tools/fetch-labels.py). Pass flags with CLI_ARGS, e.g. task labels:fetch -- --device --library ~/ROMS --only GBA --limit 5 --dry-run'
    cmds:
      - python3 tools/fetch-labels.py {{.CLI_ARGS}}

  hacks:check:
    desc: 'Compare installed ROM hacks with their latest releases, read only (tools/hacks.py, docs/HACKS.md). Pass flags with CLI_ARGS, e.g. task hacks:check -- --device --library ~/ROMS'
    cmds:
      - python3 tools/hacks.py --check {{.CLI_ARGS}}

  hacks:update:
    desc: 'Update ROM hacks on the card and in the library, keeping saves and moving states to a backup (tools/hacks.py). Always --dry-run first, e.g. task hacks:update -- --device --library ~/ROMS --update pokemon-unbound --dry-run'
    cmds:
      - python3 tools/hacks.py {{.CLI_ARGS}}

  labels:logo-tool:
    desc: Build the Logo Only renderer that fetch-labels.py --logo-fallback runs, build/slot/target/release/examples/logo_label (SLOT_LOGO_LABEL overrides the path)
    deps: [build]
    cmds:
      - cd build/slot && cargo build --release --quiet -p slot-ui --example logo_label
