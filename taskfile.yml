version: '3'

vars:
  FCEUMM_COMMIT:
    sh: . ./SLOT_PIN && echo "$fceumm_commit"
  SNES9X_COMMIT:
    sh: . ./SLOT_PIN && echo "$snes9x_commit"
  NESTOPIA_COMMIT:
    sh: . ./SLOT_PIN && echo "$nestopia_commit"
  SNES9X2005_PLUS_COMMIT:
    sh: . ./SLOT_PIN && echo "$snes9x2005_plus_commit"
  GENESIS_PLUS_GX_COMMIT:
    sh: . ./SLOT_PIN && echo "$genesis_plus_gx_commit"

tasks:
  default:
    desc: List available tasks
    silent: true
    cmds:
      - task --list

  work:init:
    desc: Extract the pinned slot release into work/slot as one commit, on branch nes-snes. Never touches an existing work/slot
    status:
      - sh -c '. scripts/lib.sh; own_repo work/slot && git -C work/slot rev-parse -q --verify HEAD'
    cmds:
      - sh scripts/init-work.sh

  work:resume:
    desc: Replay patches/ as commits on a fresh work/slot so work can continue on a new machine
    cmds:
      - sh scripts/resume-work.sh

  upstream:build:
    desc: Extract the pinned slot release into build/slot-upstream with no patches
    status:
      - test -L build/slot-upstream/vendor
      - test -e build/slot-upstream/vendor
      - test "$(cat build/slot-upstream.meta 2>/dev/null)" = "$(sh scripts/fetch-slot.sh stamp)"
    cmds:
      - sh scripts/fetch-slot.sh fetch build/slot-upstream
      - 'echo "built build/slot-upstream"'

  build:
    desc: Extract the pinned slot release into build/slot and apply patches/ in name order
    status:
      - test -L build/slot/vendor
      - test -e build/slot/vendor
      - test "$(cat build/slot.meta 2>/dev/null)" = "$(sh scripts/apply-patches.sh stamp)"
    cmds:
      - sh scripts/fetch-slot.sh fetch build/slot
      - sh scripts/apply-patches.sh build build/slot
      - 'echo "built build/slot"'

  patches:export:
    desc: Write every commit on work/slot's nes-snes branch to patches/ with git format-patch --binary
    cmds:
      - sh scripts/export-patches.sh

  patches:check:
    desc: Apply patches/ to a clean extraction and fail if the tree differs from work/slot HEAD
    cmds:
      - |
        . scripts/lib.sh
        own_repo work/slot || { echo "slot-nes-snes: work/slot is not a git checkout, run task work:init" >&2; exit 1; }
      - sh scripts/fetch-slot.sh fetch build/slot-check
      - sh scripts/apply-patches.sh build build/slot-check
      - |
        set -eu
        git -C build/slot-check fetch -q "$PWD/work/slot" HEAD
        git -C build/slot-check add -A -f -- . ':!vendor'
        git -C build/slot-check diff --cached --stat --exit-code FETCH_HEAD
        echo "patches/ rebuilds work/slot HEAD exactly"

  core:fceumm:src:
    desc: Fetch the pinned fceumm source tarball into vendor/ and verify its sha256, it ships as corresponding source
    status:
      - test -f vendor/fceumm-src.tar.gz
      - test "$(cat vendor/fceumm-src.sha 2>/dev/null)" = "{{.FCEUMM_COMMIT}}"
    cmds:
      - rm -f vendor/fceumm-src.tar.gz vendor/fceumm-src.sha
      - sh cores/fceumm/build.sh fetch {{.FCEUMM_COMMIT}} vendor/fceumm-src.tar.gz
      - echo "{{.FCEUMM_COMMIT}}" > vendor/fceumm-src.sha

  core:snes9x:src:
    desc: Fetch the pinned snes9x source tarball into vendor/ and verify its sha256, it ships as corresponding source
    status:
      - test -f vendor/snes9x-src.tar.gz
      - test "$(cat vendor/snes9x-src.sha 2>/dev/null)" = "{{.SNES9X_COMMIT}}"
    cmds:
      - rm -f vendor/snes9x-src.tar.gz vendor/snes9x-src.sha
      - sh cores/snes9x/build.sh fetch {{.SNES9X_COMMIT}} vendor/snes9x-src.tar.gz
      - echo "{{.SNES9X_COMMIT}}" > vendor/snes9x-src.sha

  core:nestopia:src:
    desc: Fetch the pinned nestopia source tarball into vendor/ and verify its sha256, it ships as corresponding source
    status:
      - test -f vendor/nestopia-src.tar.gz
      - test "$(cat vendor/nestopia-src.sha 2>/dev/null)" = "{{.NESTOPIA_COMMIT}}"
    cmds:
      - rm -f vendor/nestopia-src.tar.gz vendor/nestopia-src.sha
      - sh cores/nestopia/build.sh fetch {{.NESTOPIA_COMMIT}} vendor/nestopia-src.tar.gz
      - echo "{{.NESTOPIA_COMMIT}}" > vendor/nestopia-src.sha

  core:snes9x2005_plus:src:
    desc: Fetch the pinned snes9x2005 (USE_BLARGG_APU) source tarball into vendor/ and verify its sha256, it ships as corresponding source
    status:
      - test -f vendor/snes9x2005_plus-src.tar.gz
      - test "$(cat vendor/snes9x2005_plus-src.sha 2>/dev/null)" = "{{.SNES9X2005_PLUS_COMMIT}}"
    cmds:
      - rm -f vendor/snes9x2005_plus-src.tar.gz vendor/snes9x2005_plus-src.sha
      - sh cores/snes9x2005_plus/build.sh fetch {{.SNES9X2005_PLUS_COMMIT}} vendor/snes9x2005_plus-src.tar.gz
      - echo "{{.SNES9X2005_PLUS_COMMIT}}" > vendor/snes9x2005_plus-src.sha

  core:genesis_plus_gx:src:
    desc: Fetch the pinned Genesis Plus GX source tarball into vendor/ and verify its sha256, it ships as corresponding source
    status:
      - test -f vendor/genesis_plus_gx-src.tar.gz
      - test "$(cat vendor/genesis_plus_gx-src.sha 2>/dev/null)" = "{{.GENESIS_PLUS_GX_COMMIT}}"
    cmds:
      - rm -f vendor/genesis_plus_gx-src.tar.gz vendor/genesis_plus_gx-src.sha
      - sh cores/genesis_plus_gx/build.sh fetch {{.GENESIS_PLUS_GX_COMMIT}} vendor/genesis_plus_gx-src.tar.gz
      - echo "{{.GENESIS_PLUS_GX_COMMIT}}" > vendor/genesis_plus_gx-src.sha

  core:genesis_plus_gx:host:
    desc: Build the Genesis Plus GX host dylib into vendor/ (not part of core:host or task check yet, no frontend code uses it)
    deps: [core:genesis_plus_gx:src]
    status:
      - test -f vendor/genesis_plus_gx_libretro.dylib
      - test "$(cat vendor/genesis_plus_gx_libretro.dylib.meta 2>/dev/null)" = "$(sh cores/genesis_plus_gx/build.sh stamp {{.GENESIS_PLUS_GX_COMMIT}} host)"
    cmds:
      - sh cores/genesis_plus_gx/build.sh build {{.GENESIS_PLUS_GX_COMMIT}} vendor/genesis_plus_gx-src.tar.gz build/genesis_plus_gx-host vendor/genesis_plus_gx_libretro.dylib

  core:host:
    desc: Build mGBA, fetch gpSP and build fceumm, snes9x, nestopia and snes9x2005_plus from their pinned source into the shared vendor/, and check the gpSP dylib against gpsp_host_sha256_<arch> in SLOT_PIN
    deps: [core:fceumm:src, core:snes9x:src, core:nestopia:src, core:snes9x2005_plus:src]
    cmds:
      - '{{.TASK_EXE}} -d build/slot core:mgba:host'
      - '{{.TASK_EXE}} -d build/slot core:gpsp:host'
      - sh scripts/core-host.sh
      - |
        test -f vendor/fceumm_libretro.dylib &&
          test "$(cat vendor/fceumm_libretro.dylib.meta 2>/dev/null)" = "$(sh cores/fceumm/build.sh stamp {{.FCEUMM_COMMIT}} host)" ||
          sh cores/fceumm/build.sh build {{.FCEUMM_COMMIT}} vendor/fceumm-src.tar.gz build/fceumm-host vendor/fceumm_libretro.dylib
      - |
        test -f vendor/snes9x_libretro.dylib &&
          test "$(cat vendor/snes9x_libretro.dylib.meta 2>/dev/null)" = "$(sh cores/snes9x/build.sh stamp {{.SNES9X_COMMIT}} host)" ||
          sh cores/snes9x/build.sh build {{.SNES9X_COMMIT}} vendor/snes9x-src.tar.gz build/snes9x-host vendor/snes9x_libretro.dylib
      - |
        test -f vendor/nestopia_libretro.dylib &&
          test "$(cat vendor/nestopia_libretro.dylib.meta 2>/dev/null)" = "$(sh cores/nestopia/build.sh stamp {{.NESTOPIA_COMMIT}} host)" ||
          sh cores/nestopia/build.sh build {{.NESTOPIA_COMMIT}} vendor/nestopia-src.tar.gz build/nestopia-host vendor/nestopia_libretro.dylib
      - |
        test -f vendor/snes9x2005_plus_libretro.dylib &&
          test "$(cat vendor/snes9x2005_plus_libretro.dylib.meta 2>/dev/null)" = "$(sh cores/snes9x2005_plus/build.sh stamp {{.SNES9X2005_PLUS_COMMIT}} host)" ||
          sh cores/snes9x2005_plus/build.sh build {{.SNES9X2005_PLUS_COMMIT}} vendor/snes9x2005_plus-src.tar.gz build/snes9x2005_plus-host vendor/snes9x2005_plus_libretro.dylib

  core:device:
    desc: Build the aarch64 linux fceumm, snes9x, nestopia and snes9x2005_plus cores into vendor/
    cmds:
      - task: core:device:fceumm
      - task: core:device:snes9x
      - task: core:device:nestopia
      - task: core:device:snes9x2005_plus

  core:device:fceumm:
    desc: Build the aarch64 linux fceumm core into vendor/fceumm_libretro.so (beside the host dylib, where slot's dist reads cores), in rust:1-bullseye via scripts/device-sh.sh
    deps: [core:fceumm:src]
    status:
      - test -f vendor/fceumm_libretro.so
      - test "$(cat vendor/fceumm-src.meta 2>/dev/null)" = "$(sh cores/fceumm/build.sh srcmeta {{.FCEUMM_COMMIT}} vendor/fceumm-src.tar.gz)"
      - test "$(cat vendor/fceumm_libretro.so.meta 2>/dev/null)" = "$(sh cores/fceumm/build.sh stamp {{.FCEUMM_COMMIT}} device)"
    cmds:
      - >-
        CORE_BUILDER="$(sh cores/fceumm/build.sh builder)" sh scripts/device-sh.sh
        'sh cores/fceumm/build.sh build {{.FCEUMM_COMMIT}} vendor/fceumm-src.tar.gz
        build/fceumm-device vendor/fceumm_libretro.so'
      - sh -c '. scripts/lib.sh; is_aarch64 vendor/fceumm_libretro.so'
      - 'echo "built vendor/fceumm_libretro.so from vendor/fceumm-src.tar.gz @ {{.FCEUMM_COMMIT}}"'

  core:device:snes9x:
    desc: Build the aarch64 linux snes9x core into vendor/snes9x_libretro.so, in rust:1-bullseye via scripts/device-sh.sh
    deps: [core:snes9x:src]
    status:
      - test -f vendor/snes9x_libretro.so
      - test "$(cat vendor/snes9x-src.meta 2>/dev/null)" = "$(sh cores/snes9x/build.sh srcmeta {{.SNES9X_COMMIT}} vendor/snes9x-src.tar.gz)"
      - test "$(cat vendor/snes9x_libretro.so.meta 2>/dev/null)" = "$(sh cores/snes9x/build.sh stamp {{.SNES9X_COMMIT}} device)"
    cmds:
      - >-
        CORE_BUILDER="$(sh cores/snes9x/build.sh builder)" sh scripts/device-sh.sh
        'sh cores/snes9x/build.sh build {{.SNES9X_COMMIT}} vendor/snes9x-src.tar.gz
        build/snes9x-device vendor/snes9x_libretro.so'
      - sh -c '. scripts/lib.sh; is_aarch64 vendor/snes9x_libretro.so'
      - 'echo "built vendor/snes9x_libretro.so from vendor/snes9x-src.tar.gz @ {{.SNES9X_COMMIT}}"'

  core:device:nestopia:
    desc: Build the aarch64 linux nestopia core into vendor/nestopia_libretro.so, in rust:1-bullseye via scripts/device-sh.sh
    deps: [core:nestopia:src]
    status:
      - test -f vendor/nestopia_libretro.so
      - test "$(cat vendor/nestopia-src.meta 2>/dev/null)" = "$(sh cores/nestopia/build.sh srcmeta {{.NESTOPIA_COMMIT}} vendor/nestopia-src.tar.gz)"
      - test "$(cat vendor/nestopia_libretro.so.meta 2>/dev/null)" = "$(sh cores/nestopia/build.sh stamp {{.NESTOPIA_COMMIT}} device)"
    cmds:
      - >-
        CORE_BUILDER="$(sh cores/nestopia/build.sh builder)" sh scripts/device-sh.sh
        'sh cores/nestopia/build.sh build {{.NESTOPIA_COMMIT}} vendor/nestopia-src.tar.gz
        build/nestopia-device vendor/nestopia_libretro.so'
      - sh -c '. scripts/lib.sh; is_aarch64 vendor/nestopia_libretro.so'
      - 'echo "built vendor/nestopia_libretro.so from vendor/nestopia-src.tar.gz @ {{.NESTOPIA_COMMIT}}"'

  core:device:snes9x2005_plus:
    desc: Build the aarch64 linux snes9x2005_plus core into vendor/snes9x2005_plus_libretro.so, in rust:1-bullseye via scripts/device-sh.sh
    deps: [core:snes9x2005_plus:src]
    status:
      - test -f vendor/snes9x2005_plus_libretro.so
      - test "$(cat vendor/snes9x2005_plus-src.meta 2>/dev/null)" = "$(sh cores/snes9x2005_plus/build.sh srcmeta {{.SNES9X2005_PLUS_COMMIT}} vendor/snes9x2005_plus-src.tar.gz)"
      - test "$(cat vendor/snes9x2005_plus_libretro.so.meta 2>/dev/null)" = "$(sh cores/snes9x2005_plus/build.sh stamp {{.SNES9X2005_PLUS_COMMIT}} device)"
    cmds:
      - >-
        CORE_BUILDER="$(sh cores/snes9x2005_plus/build.sh builder)" sh scripts/device-sh.sh
        'sh cores/snes9x2005_plus/build.sh build {{.SNES9X2005_PLUS_COMMIT}} vendor/snes9x2005_plus-src.tar.gz
        build/snes9x2005_plus-device vendor/snes9x2005_plus_libretro.so'
      - sh -c '. scripts/lib.sh; is_aarch64 vendor/snes9x2005_plus_libretro.so'
      - 'echo "built vendor/snes9x2005_plus_libretro.so from vendor/snes9x2005_plus-src.tar.gz @ {{.SNES9X2005_PLUS_COMMIT}}"'

  core:device:genesis_plus_gx:
    desc: Build the aarch64 linux Genesis Plus GX core into vendor/genesis_plus_gx_libretro.so, in rust:1-bullseye via scripts/device-sh.sh (not part of core:device or dist:device yet)
    deps: [core:genesis_plus_gx:src]
    status:
      - test -f vendor/genesis_plus_gx_libretro.so
      - test "$(cat vendor/genesis_plus_gx-src.meta 2>/dev/null)" = "$(sh cores/genesis_plus_gx/build.sh srcmeta {{.GENESIS_PLUS_GX_COMMIT}} vendor/genesis_plus_gx-src.tar.gz)"
      - test "$(cat vendor/genesis_plus_gx_libretro.so.meta 2>/dev/null)" = "$(sh cores/genesis_plus_gx/build.sh stamp {{.GENESIS_PLUS_GX_COMMIT}} device)"
    cmds:
      - >-
        CORE_BUILDER="$(sh cores/genesis_plus_gx/build.sh builder)" sh scripts/device-sh.sh
        'sh cores/genesis_plus_gx/build.sh build {{.GENESIS_PLUS_GX_COMMIT}} vendor/genesis_plus_gx-src.tar.gz
        build/genesis_plus_gx-device vendor/genesis_plus_gx_libretro.so'
      - sh -c '. scripts/lib.sh; is_aarch64 vendor/genesis_plus_gx_libretro.so'
      - 'echo "built vendor/genesis_plus_gx_libretro.so from vendor/genesis_plus_gx-src.tar.gz @ {{.GENESIS_PLUS_GX_COMMIT}}"'

  test:
    desc: Run the whole upstream-plus-ours test suite in build/slot with SLOT_REQUIRE_CORES=1 and fail on a skip for a missing core
    deps: [upstream:build]
    env:
      SLOT_REQUIRE_CORES: '1'
    cmds:
      - sh scripts/run-tests.sh build/slot

  check:
    desc: Build both trees and the host cores, run every test and the card tests, then fmt, lint and the upstream-test guard
    cmds:
      - task: upstream:build
      - task: build
      - task: core:host
      - test -f vendor/mgba_libretro.dylib
      - test -f vendor/gpsp_libretro.dylib
      - test -f vendor/fceumm_libretro.dylib
      - test -f vendor/snes9x_libretro.dylib
      - test -f vendor/nestopia_libretro.dylib
      - test -f vendor/snes9x2005_plus_libretro.dylib
      - task: test
      - |
        {{.TASK_EXE}} -d build/slot test:card || {
          echo "test:card failed, retrying once (upstream card tests are timing sensitive)" >&2
          {{.TASK_EXE}} -d build/slot test:card
        }
      - task: fmt:check
      - task: lint
      - sh scripts/check-upstream-tests.sh
      - task: diffsurface:check
      - task: harness:control
      - task: harness:compare
      - task: harness:inject

  diffsurface:
    desc: Print the net changed lines per upstream file the patches touch and rewrite docs/UPSTREAM-TOUCHPOINTS.md (one row per changed hunk, reasons kept); new hunks need a reason
    cmds:
      - sh scripts/diffsurface.sh

  diffsurface:check:
    desc: Fail if docs/UPSTREAM-TOUCHPOINTS.md does not match patches/ or a touch point has no reason
    cmds:
      - sh scripts/diffsurface.sh --check

  fmt:check:
    desc: Run rustfmt --check on every .rs file we add or change in build/slot
    cmds:
      - sh scripts/check-format.sh

  lint:
    desc: Run both clippy passes in both trees and fail on any warning upstream does not have
    cmds:
      - sh scripts/check-lint.sh

  harness:warm:
    desc: Copy frame_dump into both trees, build it, and pre-build the label cache into build/harness/root from harness/root-template
    deps: [upstream:build, build]
    cmds:
      - sh scripts/harness.sh warm

  harness:control:
    desc: Run every harness leg twice in each tree and fail on any differing frame hash or on patched retries above upstream's plus one, then record that the control passed. Needs a mostly idle machine, a busy one fails closed
    deps: [upstream:build, build]
    cmds:
      - sh scripts/harness.sh control

  harness:compare:
    desc: Run every harness leg twice in upstream and twice in patched and fail unless all four runs are identical, refuses until harness:control passed for the current inputs. Needs a mostly idle machine, a busy one fails closed
    deps: [upstream:build, build]
    cmds:
      - sh scripts/harness.sh compare

  harness:inject:
    desc: Prove the harness can fail, two composite --no-wait runs on a cold cache of 403 large generated labels must differ in at least 20 frames, the same runs on a warm cache must show 0, and two composite --wait runs on the same cold script must show 0
    deps: [upstream:build, build]
    cmds:
      - sh scripts/harness.sh inject

  bench:compare:
    desc: Run core_bench for mgba and gpsp on harness/roms in both trees and fail if the patched minimum of the repeat medians is over 2% above upstream's
    deps: [upstream:build, build]
    cmds:
      - sh scripts/bench-compare.sh

  bench:device:
    desc: Run core_bench on a connected device over adb. CORE=mgba|gpsp|fceumm|nestopia|snes9x|snes9x2005_plus|genesis_plus_gx (default mgba), ROM=local path (default harness/roms/240pee_mb.gba) or ROM_ON_DEVICE=/mnt/sdcard/Games/... for a cart already on the card (nothing is pushed), ARGS and SD optional. Run task deploy:device first, the core under test is the one already in System/ (genesis_plus_gx is not in the dist yet, so adb push vendor/genesis_plus_gx_libretro.so to System/ by hand)
    deps: [build]
    env:
      CORE: '{{.CORE}}'
      ROM: '{{.ROM}}'
      ROM_ON_DEVICE: '{{.ROM_ON_DEVICE}}'
      SD: '{{.SD}}'
      ARGS: '{{.ARGS}}'
    cmds:
      - sh scripts/bench-device.sh

  perf:eval:
    desc: Run core_bench on the device for every platform and core pair (3 runs each, normal, serialize, fast-forward), record governor and SoC temperature, discard hot runs, write docs/perf/<date>/ logs and perf-eval.md. Needs the cores deployed (task deploy:device) and a rested device on the charger. DATE, RUNS, SD optional
    deps: [build]
    env:
      DATE: '{{.DATE}}'
      RUNS: '{{.RUNS}}'
      SD: '{{.SD}}'
    cmds:
      - sh scripts/perf-eval.sh

  perf:play:
    desc: Automated device play for #45. Backs up the device config, points slot at a card cart per pair, injects the same scripted input for MINUTES (default 10) over RUNS runs (default 3), ejects, pulls slot.log with ROM names redacted into docs/perf/<date>/play/ and writes play-eval.md. No args runs the default pairs, CORE or PLATFORM narrow them, CORE and PLATFORM and STEM run one custom pair. Restores the device on exit. SD, DATE optional
    env:
      CORE: '{{.CORE}}'
      PLATFORM: '{{.PLATFORM}}'
      STEM: '{{.STEM}}'
      MINUTES: '{{.MINUTES}}'
      RUNS: '{{.RUNS}}'
      SD: '{{.SD}}'
      DATE: '{{.DATE}}'
    cmds:
      - sh scripts/auto-play.sh

  readout:device:
    desc: Pull slot.log off the device and print the audio starve lines and the latency summary. Pass a saved log with CLI_ARGS to re-read it
    cmds:
      - sh scripts/device-readout.sh {{.CLI_ARGS}}

  eval:frontend-cost:
    desc: Time convert, publish and upload per frame for mgba, gpsp, fceumm and snes9x at their real canvases and fail if NES or SNES is over 5% above the larger GBA figure
    deps: [build]
    cmds:
      - sh evals/eval-frontend-cost.sh

  dist:device:
    desc: Build build/dist/<release name>/ for the H700, slot's own dist:device plus the fceumm, snes9x, nestopia and snes9x2005_plus cores, their .meta, source and licences. Fails unless every core's shippable set exists. Skipped while its inputs are unchanged
    deps: [build, core:device]
    vars:
      NAME:
        sh: . ./SLOT_PIN && echo "slot-nes-snes-$tag-$(cat VERSION)"
    sources:
      - SLOT_PIN
      - VERSION
      - mise.toml
      - patches/*.patch
      - licenses/*
      - cores/**/*
      - vendor/fceumm_libretro.so*
      - vendor/fceumm-src.*
      - vendor/snes9x_libretro.so*
      - vendor/snes9x-src.*
      - vendor/nestopia_libretro.so*
      - vendor/nestopia-src.*
      - vendor/snes9x2005_plus_libretro.so*
      - vendor/snes9x2005_plus-src.*
      - scripts/dist-device.sh
      - scripts/device-sh.sh
      - scripts/fetch-task.sh
      - scripts/lib.sh
      - scripts/zip-check.sh
      - taskfile.yml
    generates:
      - build/dist/{{.NAME}}/System/slot
    cmds:
      - sh scripts/dist-device.sh

  src-tarball:
    desc: Write build/slot-nes-snes-src-<tag>-<ns.N>.tar.gz (work/slot HEAD plus this repo HEAD, the GPL-3 source) and copy it into the dist tree. Fails unless patches/ rebuild work/slot HEAD
    cmds:
      - task: patches:check
      - sh scripts/src-tarball.sh

  zip:
    desc: Write build/slot-nes-snes-<tag>-<ns.N>-h700.zip from a fresh dist tree, source tarball included
    cmds:
      - task: dist:device
      - task: src-tarball
      - |
        set -eu
        . ./SLOT_PIN
        name="slot-nes-snes-$tag-$(cat VERSION)"
        rm -f "build/$name-h700.zip"
        (cd build/dist && zip -qry "../$name-h700.zip" "$name")
        echo "built build/$name-h700.zip"

  deploy:device:
    desc: Build the dist tree and push its System/ onto a device over adb (not the 18 MB source tarball), then restart it. SD defaults to /mnt/sdcard
    vars:
      SD: '{{.SD | default "/mnt/sdcard"}}'
    cmds:
      - task: dist:device
      - adb wait-for-device
      - |
        set -eu
        . ./SLOT_PIN
        sys="build/dist/slot-nes-snes-$tag-$(cat VERSION)/System"
        adb shell mkdir -p '{{.SD}}/System/licenses'
        for f in "$sys"/*; do
          [ "$f" = "$sys/licenses" ] || adb push "$f" '{{.SD}}/System/'
        done
        for f in "$sys"/licenses/*; do
          case "$f" in */slot-nes-snes-src-*) ;; *) adb push "$f" '{{.SD}}/System/licenses/' ;; esac
        done
      - adb shell 'chmod +x {{.SD}}/System/slot {{.SD}}/System/fceumm_libretro.so {{.SD}}/System/snes9x_libretro.so {{.SD}}/System/nestopia_libretro.so {{.SD}}/System/snes9x2005_plus_libretro.so && sync'
      - adb reboot
      - adb wait-for-device
      - 'echo "deployed to {{.SD}}, device rebooting"'

  log:device:
    desc: Read slot's log back off a connected device
    vars:
      SD: '{{.SD | default "/mnt/sdcard"}}'
    cmds:
      - adb shell 'cat {{.SD}}/Logs/slot.log'

  roms:push:
    desc: 'Push a ROM library (zips ok, duplicates skipped), saves and optionally states to the device over adb. Pass flags with CLI_ARGS, e.g. task roms:push -- --src ~/ROMS --only gba'
    cmds:
      - python3 scripts/push-roms.py {{.CLI_ARGS}}

  labels:fetch:
    desc: 'Fetch real cart labels onto the SD card (tools/fetch-labels.py). Pass flags with CLI_ARGS, e.g. task labels:fetch -- --device --library ~/ROMS --only GBA --limit 5 --dry-run'
    cmds:
      - python3 tools/fetch-labels.py {{.CLI_ARGS}}
